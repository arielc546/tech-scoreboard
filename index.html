<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>National Tech Scoreboards</title>
<meta name="description" content="How much is each country's homegrown tech worth? 50 countries, ~330 companies — standing value, realized exits, and per-capita, from TSMC to Nubank.">
<meta property="og:title" content="National Tech Scoreboards">
<meta property="og:description" content="How much is each country's homegrown tech worth? 50 countries compared — standing value, exits, per capita.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://arielc546.github.io/tech-scoreboard/">
<meta property="og:image" content="https://arielc546.github.io/tech-scoreboard/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🗺️</text></svg>'>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    color-scheme: dark;
    --page:           #0d0d0d;
    --surface-1:      #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --hairline:       #2c2c2a;
    --border:         rgba(255,255,255,0.10);
    --independent:    #3987e5;   /* categorical slot 1 (dark) */
    --acquired:       #c98500;   /* categorical slot 4 (dark) */
    --not-researched: #232321;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--hairline);
    flex-wrap: wrap;
  }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  header .sub { font-size: 13px; color: var(--text-muted); }
  .spacer { flex: 1; }

  .toggle {
    display: flex; border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; font-size: 13px;
  }
  .toggle button {
    background: none; border: none; color: var(--text-secondary);
    padding: 6px 14px; cursor: pointer; font: inherit;
  }
  .toggle button.active {
    background: var(--surface-1); color: var(--text-primary); font-weight: 600;
  }

  /* ---------- layout ---------- */
  main { flex: 1; display: flex; min-height: 0; }
  #map { flex: 1; background: var(--page); }
  .leaflet-container { background: var(--page); font: inherit; }
  .leaflet-interactive:focus { outline: none; } /* selection is shown by our own white stroke */

  /* ---------- legend ---------- */
  .legend {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font-size: 11px;
    color: var(--text-secondary); line-height: 1.35;
  }
  .legend .title { color: var(--text-muted); margin-bottom: 6px; }
  .legend .row { display: flex; align-items: center; gap: 7px; margin-top: 3px; }
  .legend .swatch { width: 14px; height: 10px; border-radius: 2px; flex: none; }

  .leaflet-tooltip.scoreboard-tip {
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    font: 12px system-ui, sans-serif; padding: 7px 10px;
  }
  .leaflet-tooltip.scoreboard-tip::before { display: none; }
  .scoreboard-tip .tip-value { color: var(--text-secondary); }

  /* ---------- panel ---------- */
  aside {
    width: 390px; flex: none; background: var(--surface-1);
    border-left: 1px solid var(--hairline);
    overflow-y: auto; padding: 22px 22px 16px;
  }
  .flag { font-size: 26px; }
  .name-row { display: flex; align-items: center; gap: 10px; margin-top: 2px; }
  .country-name { font-size: 22px; font-weight: 650; }
  .badge {
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em;
    color: var(--text-muted); border: 1px solid var(--border);
    border-radius: 5px; padding: 2px 6px; text-transform: uppercase;
  }
  .story {
    margin-top: 8px; font-size: 14px; line-height: 1.45;
    color: var(--text-secondary);
    border-left: 2px solid var(--independent); padding-left: 10px;
  }

  .tiles { display: flex; gap: 10px; margin-top: 18px; }
  .tile {
    flex: 1; background: var(--page); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px;
  }
  .tile .label { font-size: 12px; color: var(--text-muted); }
  .tile .value { font-size: 26px; font-weight: 600; margin-top: 4px; }
  .tile .hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  .percap {
    margin-top: 10px; font-size: 12.5px; color: var(--text-secondary);
  }
  .percap strong { color: var(--text-primary); font-weight: 600; }

  .companies-head {
    display: flex; align-items: baseline; margin-top: 22px; margin-bottom: 4px;
  }
  .companies-head h2 { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
  .key { margin-left: auto; font-size: 11px; color: var(--text-muted); display: flex; gap: 12px; }
  .key .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }

  .company { margin-top: 12px; }
  .company .line1 {
    display: flex; align-items: baseline; font-size: 13px;
  }
  .company .name { font-weight: 550; }
  .company .meta { color: var(--text-muted); font-size: 11.5px; margin-left: 7px; }
  .company .val { margin-left: auto; color: var(--text-secondary); font-size: 12.5px; }
  .company .track { margin-top: 4px; height: 10px; position: relative; }
  .company .bar {
    height: 10px; border-radius: 0 4px 4px 0; min-width: 3px;
  }
  .bar.independent { background: var(--independent); }
  .bar.acquired { background: var(--acquired); }

  .placeholder-note, .footnote {
    margin-top: 20px; font-size: 11.5px; color: var(--text-muted); line-height: 1.5;
    border-top: 1px solid var(--hairline); padding-top: 12px;
  }
  .empty-state { margin-top: 26px; color: var(--text-muted); font-size: 13.5px; line-height: 1.5; }

  /* ---------- compare mode ---------- */
  .btn-compare {
    margin-left: auto; background: none; border: 1px solid var(--border);
    border-radius: 7px; color: var(--text-secondary); font: 12px system-ui, sans-serif;
    padding: 4px 10px; cursor: pointer; flex: none;
  }
  .btn-compare:hover { color: var(--text-primary); border-color: var(--text-muted); }
  .cmp-head { display: flex; align-items: center; margin-bottom: 14px; }
  .cmp-head h2 { font-size: 15px; font-weight: 600; }
  .cmp-grid { display: flex; gap: 14px; align-items: flex-start; }
  .cmp-card { flex: 1; min-width: 0; }
  .cmp-card .flag { font-size: 20px; }
  .cmp-card .country-name { font-size: 16px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmp-stats { margin-top: 10px; font-size: 12px; color: var(--text-muted); line-height: 1.4; }
  .cmp-stats .big { font-size: 21px; font-weight: 600; color: var(--text-primary); display: block; }
  .cmp-stats .row { margin-top: 7px; }
  .cmp-stats .row strong { color: var(--text-secondary); font-weight: 600; }
  .cmp-card .company { margin-top: 9px; }
  .cmp-card .company .line1 { font-size: 11.5px; }
  .cmp-card .company .val { font-size: 11px; }
  .cmp-card .company .track, .cmp-card .company .bar { height: 7px; }
  .cmp-hint {
    flex: 1; border: 1px dashed var(--border); border-radius: 10px;
    color: var(--text-muted); font-size: 12.5px; text-align: center;
    padding: 40px 14px; align-self: stretch;
  }

  /* ---------- mobile: bottom sheet ---------- */
  @media (max-width: 720px) {
    main { flex-direction: column; }
    aside {
      width: 100%; border-left: none; border-top: 1px solid var(--hairline);
      border-radius: 16px 16px 0 0; max-height: 54vh; padding-top: 10px;
    }
    aside::before {
      content: ""; display: block; width: 36px; height: 4px; border-radius: 2px;
      background: var(--hairline); margin: 0 auto 12px;
    }
    header { padding: 10px 14px; gap: 10px; }
    header h1 { font-size: 15px; }
    header .sub { font-size: 11.5px; }
    .toggle button { padding: 7px 10px; font-size: 12px; }
    .tile .value { font-size: 22px; }
    .legend { font-size: 10px; padding: 8px 10px; max-width: 44vw; }
  }
  * { -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>

<header>
  <div>
    <h1>National Tech Scoreboards</h1>
    <div class="sub" id="subtitle">Value of homegrown tech, country by country</div>
  </div>
  <div class="spacer"></div>
  <div class="toggle" role="group" aria-label="Map metric">
    <button id="btn-standing" class="active">Standing</button>
    <button id="btn-created">Value created</button>
    <button id="btn-pc">Per capita</button>
  </div>
</header>

<main>
  <div id="map"></div>
  <aside id="panel"><div class="empty-state">Loading data…</div></aside>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let DATA = {};
let META = {};

function standing(c) {
  if (c.companies) return c.companies.filter(x => x.status === "independent").reduce((s, x) => s + x.value_busd, 0);
  return c.standing;
}
function realized(c) {
  if (c.companies) return c.companies.filter(x => x.status === "acquired").reduce((s, x) => s + x.value_busd, 0);
  return c.realized;
}
function created(c) { return standing(c) + realized(c); }
function perCapita(c) { return standing(c) * 1e9 / (c.pop * 1e6); } // $ per person

const fmtB = v => v >= 1000 ? "$" + (v / 1000).toFixed(1).replace(/\.0$/, "") + "T"
                            : "$" + (v >= 100 ? Math.round(v) : Math.round(v * 10) / 10) + "B";
const fmtPC = v => v >= 1000 ? "$" + (v / 1000).toFixed(1).replace(/\.0$/, "") + "K"
                             : "$" + Math.round(v);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

/* ---------- choropleth scale (sequential blue ramp, palette steps 100→700) ---------- */
const RAMP = ["#cde2fb", "#9ec5f4", "#6da7ec", "#3987e5", "#256abf", "#184f95", "#0d366b"];
const BINS = {
  standing: { thresholds: [20, 50, 100, 200, 400, 1000],
         labels: ["< $20B", "$20–50B", "$50–100B", "$100–200B", "$200–400B", "$400B–1T", "≥ $1T"],
         value: standing, fmt: fmtB, suffix: " standing",
         title: "Standing value (homegrown, independent)" },
  created: { thresholds: [20, 50, 100, 200, 400, 1000],
         labels: ["< $20B", "$20–50B", "$50–100B", "$100–200B", "$200–400B", "$400B–1T", "≥ $1T"],
         value: created, fmt: fmtB, suffix: " created",
         title: "Value created (standing + realized exits)" },
  pc:  { thresholds: [1000, 2500, 5000, 7500, 10000, 20000],
         labels: ["< $1K", "$1–2.5K", "$2.5–5K", "$5–7.5K", "$7.5–10K", "$10–20K", "≥ $20K"],
         value: perCapita, fmt: fmtPC, suffix: " per capita",
         title: "Standing value per capita" },
};
let mode = "standing";
let selected = "SWE";
let compare = null; // null, or { left: code, right: code | null }

function credLine() {
  return `Sources: public market data &amp; press reports · data as of ${META.updated || "—"} · nationality = where founded; disputed cases decided by employee majority.`;
}

function handleCountryClick(code) {
  if (compare && DATA[code]) {
    if (code !== compare.left) compare.right = code;
    selected = code;
  } else {
    selected = code;
  }
  syncHash();
  refresh();
}

function syncHash() {
  if (compare && DATA[compare.left]) {
    history.replaceState(null, "", "#" + compare.left + (compare.right ? "," + compare.right : ""));
  } else if (DATA[selected]) {
    history.replaceState(null, "", "#" + selected);
  }
  const base = "National Tech Scoreboards";
  if (compare && compare.right) document.title = `${DATA[compare.left].name} vs ${DATA[compare.right].name} — ${base}`;
  else if (DATA[selected]) document.title = `${DATA[selected].name} — ${base}`;
  else document.title = base;
}

function binColor(v, thresholds) {
  let i = 0;
  while (i < thresholds.length && v >= thresholds[i]) i++;
  return RAMP[i];
}

/* ---------- map ---------- */
const map = L.map("map", { zoomControl: true, attributionControl: false, minZoom: 2, maxZoom: 6 });
map.fitBounds([[30, -25], [67, 44]]); // open on Europe + Israel; North America is one pan away

const legend = L.control({ position: "bottomleft" });
legend.onAdd = function () {
  this._div = L.DomUtil.create("div", "legend");
  this.update();
  return this._div;
};
legend.update = function () {
  const b = BINS[mode];
  this._div.innerHTML = `<div class="title">${b.title}</div>` +
    b.labels.map((l, i) =>
      `<div class="row"><span class="swatch" style="background:${RAMP[i]}"></span>${l}</div>`).join("") +
    `<div class="row"><span class="swatch" style="background:var(--not-researched)"></span>Not researched yet</div>`;
};
legend.addTo(map);

let geoLayer = null;
let sgpMarker = null; // Singapore is too small for the boundary GeoJSON — rendered as a dot

function sgpStyle() {
  const c = DATA.SGP;
  const b = BINS[mode];
  return {
    radius: 6, fillOpacity: 1,
    fillColor: binColor(b.value(c), b.thresholds),
    color: isHighlighted("SGP") ? "#ffffff" : "#0d0d0d",
    weight: isHighlighted("SGP") ? 2 : 1.2,
  };
}

function isHighlighted(code) {
  if (compare) return code === compare.left || code === compare.right;
  return code === selected;
}

function styleFor(feature) {
  const c = DATA[feature.id];
  const isSel = isHighlighted(feature.id);
  if (!c) return { fillColor: "#232321", fillOpacity: 1, color: "#2c2c2a", weight: 0.7 };
  const b = BINS[mode];
  return {
    fillColor: binColor(b.value(c), b.thresholds),
    fillOpacity: 1,
    color: isSel ? "#ffffff" : "#0d0d0d",
    weight: isSel ? 2 : 1.2,
  };
}

Promise.all([
  fetch("data/countries.json").then(r => r.json()),
  fetch("https://cdn.jsdelivr.net/gh/johan/world.geo.json@master/countries.geo.json").then(r => r.json()),
]).then(([data, geo]) => {
  META = data._meta || {};
  delete data._meta;
  DATA = data;
  const parts = location.hash.slice(1).toUpperCase().split(",").filter(p => DATA[p]);
  if (parts.length >= 2) { compare = { left: parts[0], right: parts[1] }; selected = parts[1]; }
  else if (parts.length === 1) selected = parts[0];
  document.getElementById("subtitle").textContent =
    `${Object.keys(DATA).length} countries · value of homegrown tech · ${META.updated || ""}`;
  syncHash();
  geoLayer = L.geoJSON(geo, {
    style: styleFor,
    onEachFeature: (feature, layer) => {
      layer.bindTooltip(() => {
        const c = DATA[feature.id];
        if (!c) return `<strong>${esc(feature.properties.name)}</strong><br><span class="tip-value">Not researched yet</span>`;
        const b = BINS[mode];
        return `<strong>${c.flag} ${esc(c.name)}</strong><br><span class="tip-value">${b.fmt(b.value(c))}${b.suffix}</span>`;
      }, { sticky: true, className: "scoreboard-tip" });
      layer.on("mouseover", () => { if (!isHighlighted(feature.id)) layer.setStyle({ color: "#c3c2b7", weight: 1.5 }); });
      layer.on("mouseout", () => layer.setStyle(styleFor(feature)));
      layer.on("click", () => handleCountryClick(feature.id));
    },
  }).addTo(map);
  if (DATA.SGP) {
    sgpMarker = L.circleMarker([1.35, 103.82], sgpStyle()).addTo(map);
    sgpMarker.bindTooltip(() => {
      const c = DATA.SGP, b = BINS[mode];
      return `<strong>${c.flag} ${esc(c.name)}</strong><br><span class="tip-value">${b.fmt(b.value(c))}${b.suffix}</span>`;
    }, { sticky: true, className: "scoreboard-tip" });
    sgpMarker.on("click", () => handleCountryClick("SGP"));
  }
  refresh();
});

/* ---------- panel ---------- */
function miniCard(code, maxV) {
  const c = DATA[code];
  const st = standing(c), re = realized(c), pc = perCapita(c);
  const top = (c.companies || []).slice().sort((a, b) => b.value_busd - a.value_busd).slice(0, 5);
  return `<div class="cmp-card">
    <div class="flag">${c.flag}</div>
    <div class="country-name">${esc(c.name)}</div>
    <div class="cmp-stats">
      <span class="big">${fmtB(st)}</span> standing
      <div class="row"><strong>${fmtB(re)}</strong> realized in exits</div>
      <div class="row"><strong>${fmtPC(pc)}</strong> per capita</div>
    </div>
    ${top.map(x => `
      <div class="company">
        <div class="line1"><span class="name">${esc(x.name)}</span><span class="val">${fmtB(x.value_busd)}</span></div>
        <div class="track"><div class="bar ${x.status}" style="width:${(x.value_busd / maxV) * 100}%"></div></div>
      </div>`).join("")}
  </div>`;
}

function renderPanel() {
  const el = document.getElementById("panel");
  if (compare) {
    const codes = [compare.left, compare.right].filter(x => x && DATA[x]);
    const maxV = Math.max(1e-9, ...codes.flatMap(x => (DATA[x].companies || []).map(co => co.value_busd)));
    el.innerHTML = `
      <div class="cmp-head"><h2>Compare</h2><button class="btn-compare" id="cmp-exit">✕ Exit compare</button></div>
      <div class="cmp-grid">
        ${miniCard(compare.left, maxV)}
        ${compare.right && DATA[compare.right] ? miniCard(compare.right, maxV)
          : `<div class="cmp-hint">Tap another country on the map to compare</div>`}
      </div>
      <div class="footnote">Bars share one scale across both countries. ${credLine()}</div>`;
    document.getElementById("cmp-exit").addEventListener("click", () => {
      compare = null;
      syncHash();
      refresh();
    });
    return;
  }
  const c = DATA[selected];
  if (!c) {
    el.innerHTML = `
      <div class="flag">🗺️</div>
      <div class="name-row"><div class="country-name">Not researched yet</div></div>
      <div class="empty-state">This country isn't in the v1 set of 16.
      Its scoreboard — anchor companies, standing and realized value — is future work.</div>`;
    return;
  }
  const st = standing(c), re = realized(c), pc = perCapita(c);
  let companiesHtml = "";
  if (c.companies && !c.companies.length) {
    companiesHtml = `<div class="placeholder-note">No qualifying homegrown tech companies — the story above is the whole story.</div>`;
  } else if (c.companies) {
    const max = Math.max(...c.companies.map(x => x.value_busd));
    companiesHtml = `
      <div class="companies-head">
        <h2>Anchor companies</h2>
        <div class="key">
          <span><span class="dot" style="background:var(--independent)"></span>Independent</span>
          <span><span class="dot" style="background:var(--acquired)"></span>Acquired</span>
        </div>
      </div>` +
      c.companies.map(x => {
        const meta = x.status === "acquired"
          ? `→ ${esc(x.acquirer)} ’${String(x.exit_year).slice(2)}`
          : `est. ${x.founded ?? "—"}${x.private ? " · private" : ""}`;
        const tip = x.source ? ` title="${esc(x.note ? x.source + " — " + x.note : x.source)}"` : "";
        return `
        <div class="company"${tip}>
          <div class="line1">
            <span class="name">${esc(x.name)}</span>
            <span class="meta">${meta}</span>
            <span class="val">${fmtB(x.value_busd)}</span>
          </div>
          <div class="track"><div class="bar ${x.status}" style="width:${(x.value_busd / max) * 100}%"></div></div>
        </div>`;
      }).join("");
  } else {
    companiesHtml = `<div class="placeholder-note">Company-level breakdown coming —
      this card currently shows totals only.</div>`;
  }
  const hasSources = (c.companies || []).some(x => x.source);
  const foot = c.sourced
    ? `${credLine()}${hasSources ? " Hover a company for its source." : ""}`
    : `Placeholder figures — research pending. ${credLine()}`;
  el.innerHTML = `
    <div class="flag">${c.flag}</div>
    <div class="name-row">
      <div class="country-name">${esc(c.name)}</div>
      ${c.sourced ? "" : `<span class="badge">est.</span>`}
      <button class="btn-compare" id="btn-compare">⇄ Compare</button>
    </div>
    <div class="story">${esc(c.story)}</div>
    <div class="tiles">
      <div class="tile">
        <div class="label">Standing value</div>
        <div class="value">${fmtB(st)}</div>
        <div class="hint">independent, homegrown</div>
      </div>
      <div class="tile">
        <div class="label">Realized value</div>
        <div class="value">${fmtB(re)}</div>
        <div class="hint">cumulative exits</div>
      </div>
    </div>
    <div class="percap">Per capita: <strong>${fmtPC(pc)}</strong> of standing value per person (pop. ${c.pop}M)</div>
    ${companiesHtml}
    <div class="footnote">${foot}</div>`;
  const cb = document.getElementById("btn-compare");
  if (cb) cb.addEventListener("click", () => {
    compare = { left: selected, right: null };
    syncHash();
    refresh();
  });
}

/* ---------- toggle & refresh ---------- */
function refresh() {
  if (geoLayer) geoLayer.setStyle(styleFor);
  if (sgpMarker) sgpMarker.setStyle(sgpStyle());
  legend.update();
  renderPanel();
}
const MODE_BUTTONS = { standing: "btn-standing", created: "btn-created", pc: "btn-pc" };
function setMode(m) {
  mode = m;
  for (const [key, id] of Object.entries(MODE_BUTTONS))
    document.getElementById(id).classList.toggle("active", key === m);
  refresh();
}
for (const [key, id] of Object.entries(MODE_BUTTONS))
  document.getElementById(id).addEventListener("click", () => setMode(key));
</script>
</body>
</html>
